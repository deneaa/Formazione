<div class="products-page">
  <div class="toolbar">
    <div class="toolbar-search">
      <app-search-bar (search)="onSearch($event)"></app-search-bar>
    </div>

    <select class="select" (change)="onCategoryChange($any($event.target).value)">
      <option value="">All categories</option>
      @for (category of categories; track category) {
        <option [value]="category">{{ category }}</option>
      }
    </select>

    <select class="select" (change)="onSortChange($any($event.target).value)">
      <option value="date">Newest first</option>
      <option value="rating">Top rated</option>
      <option value="category">Category</option>
    </select>

    <button class="btn btn-outline" (click)="exportPdf()">Export PDF</button>
    <button class="btn btn-primary" (click)="fetchRandom()">Get random product</button>
  </div>

  <app-product-list
    [products]="filteredProducts()"
    (addToCart)="onAddToCart($event)"
  ></app-product-list>

  @if (totalPages() > 1) {
    <div class="pagination">
      <button class="page-btn" [disabled]="currentPage() === 1" (click)="prevPage()">‹ Prev</button>

      @for (page of pages(); track page) {
        <button class="page-btn" [class.active]="page === currentPage()" (click)="goToPage(page)">
          {{ page }}
        </button>
      }

      <button class="page-btn" [disabled]="currentPage() === totalPages()" (click)="nextPage()">
        Next ›
      </button>
    </div>
  }
</div>
