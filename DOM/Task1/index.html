<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="calculator">
      <h1>Calculator</h1>

      <p class="operation"></p>
      <p class="result">0</p>

      <div class="buttons">
        <div class="row-buttons">
          <button class="button button-function delete">[X]</button>
          <button class="button button-function clear">C</button>
          <button class="button button-function percent">%</button>
          <button class="button button-operator divide">/</button>
        </div>

        <div class="row-buttons">
          <button class="button button-number">1</button>
          <button class="button button-number">2</button>
          <button class="button button-number">3</button>
          <button class="button button-operator multiply">*</button>
        </div>

        <div class="row-buttons">
          <button class="button button-number">4</button>
          <button class="button button-number">5</button>
          <button class="button button-number">6</button>
          <button class="button button-operator subtract">-</button>
        </div>

        <div class="row-buttons">
          <button class="button button-number">7</button>
          <button class="button button-number">8</button>
          <button class="button button-number">9</button>
          <button class="button button-operator add">+</button>
        </div>

        <div class="row-buttons">
          <button class="button button-operator sign">+/-</button>
          <button class="button button-number">0</button>
          <button class="button button-operator dot">.</button>
          <button class="button button-operator equals">=</button>
        </div>
      </div>
    </div>
    <script src="script2.js"></script>
  </body>
</html>
