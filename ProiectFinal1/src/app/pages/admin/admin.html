<div class="admin-page">
  <div class="admin-form card">
    <h2>Add product</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Name</label>
        <input type="text" formControlName="name" />
      </div>

      <div class="field">
        <label>Description</label>
        <textarea formControlName="description" rows="3"></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label>Price</label>
          <input type="number" step="0.01" formControlName="price" />
        </div>

        <div class="field">
          <label>Category</label>
          <select formControlName="category">
            @for (category of categories; track category) {
              <option [value]="category">{{ category }}</option>
            }
          </select>
        </div>
      </div>

      <div class="field">
        <label>Image URL (optional)</label>
        <input type="text" formControlName="imageUrl" placeholder="https://..." />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Add product</button>
    </form>
  </div>

  <div class="admin-list">
    <h2>All products ({{ productService.products().length }})</h2>

    <div class="list">
      @for (product of productService.products(); track product.id) {
        <div class="list-item card">
          <span class="name">{{ product.name }}</span>
          <span class="category">{{ product.category }}</span>
          <span class="price">${{ product.price.toFixed(2) }}</span>
          <button class="remove-btn" (click)="deleteProduct(product.id)">Delete</button>
        </div>
      }
    </div>
  </div>
</div>
